name: TEMP - Download keystore (delete after use)

on:
  workflow_dispatch:

jobs:
  deliver-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate keystore from secret
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_DOWNLOAD_B64 }}" | base64 -d > keystore/codestudio-upload.jks
          chmod 600 keystore/codestudio-upload.jks

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: codestudio-upload-keystore
          path: keystore/codestudio-upload.jks
          if-no-files-found: error