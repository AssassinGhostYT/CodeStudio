name: Build CodeStudio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - open

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0 ndk;27.1.12297006"

      - name: Rebuild native libraries for 16 KB pages
        run: ./.github/scripts/rebuild-16k-native.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Disable Kotlin incremental compilation for CI. One-shot CI builds gain nothing from it, and a
      # restored incremental-compilation cache can produce phantom "unresolved reference" errors after the
      # classpath changes (a clean build of the same commit compiles fine). Full compilation is robust.
      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      # `collectApk` runs assembleProfile and leaves the one installable build at
      # ide-android/build/apk/CodeStudio.apk — a single flat file instead of the whole
      # build/outputs/apk/<variant>/ tree, which is what made a download a folder hunt.
      - name: Build profile APK
        run: |
          set -o pipefail
          ./gradlew :ide-android:collectApk --console=plain

      - name: Validate APK archive and 16 KB alignment
        run: |
          set -euo pipefail
          apk=ide-android/build/apk/CodeStudio.apk
          test -f "$apk"
          unzip -t "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codestudio-opencode-profile
          path: ide-android/build/apk/CodeStudio.apk
          if-no-files-found: error
          compression-level: 0
