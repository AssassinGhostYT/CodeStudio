name: Build CodeStudio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - open

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Install NDK (retry on corrupted download)
        run: |
          for i in 1 2 3; do
            sdkmanager "ndk;27.1.12297006" && exit 0
            echo "NDK download failed (attempt $i), cleaning up and retrying in 30s..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006" "$ANDROID_SDK_ROOT/.temp"
            sleep 30
          done
          echo "NDK download failed after 3 attempts"
          exit 1

      - name: Rebuild native libraries for 16 KB pages
        run: ./.github/scripts/rebuild-16k-native.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Sign with the Play upload key (same identity as the release AAB) so the APK testers download
      # carries the published signature. Restores the same secrets the Release AAB workflow uses.
      - name: Restore release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/codestudio-upload.jks
          chmod 600 keystore/codestudio-upload.jks

      - name: Write signing config
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/codestudio-upload.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
          chmod 600 keystore.properties

      # Disable Kotlin incremental compilation for CI. One-shot CI builds gain nothing from it, and a
      # restored incremental-compilation cache can produce phantom "unresolved reference" errors after the
      # classpath changes (a clean build of the same commit compiles fine). Full compilation is robust.
      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      # The runner image ships a populated ~/.gradle. With org.gradle.caching=true, a task can be restored
      # from it, and Compose's resource-accessor generator has been restored that way with an older string set:
      # the build then fails with "Unresolved reference 'chat_xxx'" for a string that is in the sources and
      # that a clean local build generates. Nothing is gained by the cache on a one-shot runner.
      - name: Disable the Gradle build cache (CI)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties

      # `collectApk` runs assembleProfile and leaves the one installable build at
      # ide-android/build/apk/CodeStudio.apk — a single flat file instead of the whole
      # build/outputs/apk/<variant>/ tree, which is what made a download a folder hunt.
      - name: Build profile APK
        run: |
          set -o pipefail
          ./gradlew :ide-android:collectApk --console=plain --no-build-cache

      - name: Validate APK archive and 16 KB alignment
        run: |
          set -euo pipefail
          apk=ide-android/build/apk/CodeStudio.apk
          test -f "$apk"
          unzip -t "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codestudio-opencode-profile
          path: ide-android/build/apk/CodeStudio.apk
          if-no-files-found: error
          compression-level: 0
