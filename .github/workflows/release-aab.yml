name: Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Build the signed release AAB (Play Store / app-bundle). Signing material lives ONLY in repo
# secrets (KEYSTORE_*); keystore.properties and keystore/ are gitignored so nothing sensitive
# ever lands in git. The runner restores the keystore, configures the release signingConfig, and
# runs :ide-android:bundleRelease.
jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Provision OpenCode v1.18.18 verified asset
        run: |
          mkdir -p agent-impl/files/opencode/agents/opencode/1.18.18
          curl --retry 5 --retry-connrefused --retry-delay 3 -sL https://github.com/anomalyco/opencode/releases/download/v1.18.18/opencode-linux-arm64.tar.gz -o opencode.tar.gz
          CALC_SHA=$(sha256sum opencode.tar.gz | awk '{print $1}')
          EXPECTED_SHA="dcb1b5ec5687b43f87749560021f9203f3809e0ce5ae44ff9be8ae17083fe4ba"
          if [ "$CALC_SHA" != "$EXPECTED_SHA" ]; then
            echo "SHA256 mismatch! Expected $EXPECTED_SHA but got $CALC_SHA"
            exit 1
          fi
          tar -zxvf opencode.tar.gz -C agent-impl/files/opencode/agents/opencode/1.18.18/
          rm opencode.tar.gz

      - name: Restore release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/codestudio-upload.jks
          chmod 600 keystore/codestudio-upload.jks

      - name: Write signing config
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/codestudio-upload.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
          chmod 600 keystore.properties

      - name: Build signed release AAB
        run: |
          set -o pipefail
          ./gradlew :ide-android:bundleRelease --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report build errors
        if: ${{ always() }}
        run: |
          if [ -f /tmp/gradle.log ]; then
            grep -nE '^e: |^w: |ERROR|error:|FAILED|Caused by:|What went wrong|> Task ' /tmp/gradle.log \
              | tail -80 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: codestudio-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error