name: Build CodeStudio Sideload APK (targetSdk 28)

# A GitHub/F-Droid-style distribution build, NOT Play. Play rejects targetSdk < Play policy (currently 36),
# but SELinux only grants `execute_no_trans` on app-private app_data_file to untrusted_app with
# targetSdk <= 28 — the reason Termux/AndroidIDE (both targetSdk 28) can exec `files/usr/bin/bash` directly
# while CodeStudio's Play build (targetSdk 36) hits `Permission denied`. This job builds the SAME app with -PSIDELOAD=true
# (targetSdk 28) so the embedded Termux userland runs directly, exactly like AndroidIDE's embedded terminal.
# Never use this artifact on Play; only install side via GitHub/F-Droid.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleProfile (targetSdk 28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Build sideload profile APK (targetSdk 28)
        run: ./gradlew :ide-android:assembleProfile -PSIDELOAD=true --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codestudio-sideload-profile-apk
          path: ide-android/build/outputs/apk/profile/*.apk
          if-no-files-found: error
          retention-days: 30